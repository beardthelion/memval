[project]
name = "memval"
version = "0.1.0"
description = "Reproducible eval harness comparing durable encrypted memory backends for agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
]

[project.scripts]
memval = "memval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memval"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
